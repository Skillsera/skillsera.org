<div class="answer-item" data-url="{{ answer.url }}"
     data-start="{{ answer.start or '' }}"
     data-stop="{{ answer.stop or '' }}">
  <button class="answer-play-btn"
          @click="play('{{ answer.url }}', {{ answer.start or 'null' }}, {{ answer.stop or 'null' }})">
    ▶ Play
  </button>
  {% if answer.user and answer.user.username %}
  <span class="answer-submitter">submitted by {{ answer.user.username }}</span>
  {% endif %}
  {% if answer.start %}
    <span class="answer-timestamp">{{ answer.start }}s</span>
  {% endif %}
</div>
